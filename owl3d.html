<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/hal_lens_1.png" />
    <title>HAL · Owl3D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #030406;
      }
      #owl3d-view {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* In stereo the pointer hides when idle; move the mouse to get it back. */
      body[data-mode='sbs'].pointer-idle,
      body[data-mode='full'].pointer-idle {
        cursor: none;
      }
      /* Voice dock (src/owl3d/voice/dock.ts): chunky, for the 3D screen. */
      .voice-dock {
        --level: 0;
        position: fixed;
        bottom: 28px;
        left: 28px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 12px 30px 12px 12px;
        border-radius: 999px;
        background: rgba(5, 7, 9, 0.72);
        color: #ffffff;
        font: 800 56px -apple-system, 'SF Pro Display', Helvetica, sans-serif;
        letter-spacing: 0.02em;
        transform-origin: left bottom;
        -webkit-app-region: no-drag;
        user-select: none;
        z-index: 10;
      }
      .voice-dock button {
        -webkit-app-region: no-drag;
        cursor: pointer;
        touch-action: none;
      }
      .voice-dock__record,
      .voice-dock__stop {
        position: relative;
        width: 128px;
        height: 128px;
        padding: 0;
        border: 6px solid rgba(255, 98, 95, 0.6);
        border-radius: 50%;
        background: #14181d;
      }
      /* The red dot; it swells and glows with your voice while recording. */
      .voice-dock__record::after {
        content: '';
        position: absolute;
        inset: 26px;
        border-radius: 50%;
        background: #ff3b30;
        box-shadow: 0 0 calc(14px + var(--level) * 60px) rgba(255, 59, 48, 0.75);
        transform: scale(calc(1 + var(--level) * 0.35));
        transition: inset 120ms ease;
      }
      .voice-dock[data-state='recording'] .voice-dock__record {
        border-color: #ff3b30;
        box-shadow: 0 0 0 calc(8px + var(--level) * 26px) rgba(255, 59, 48, 0.28);
      }
      .voice-dock[data-state='recording'] .voice-dock__record::after {
        inset: 18px;
      }
      .voice-dock[data-state='off'] .voice-dock__record::after,
      .voice-dock[data-state='loading'] .voice-dock__record::after {
        background: #5a2522;
        box-shadow: none;
      }
      /* Stop: a big square, only while HAL talks. */
      .voice-dock__stop {
        border-color: rgba(238, 241, 243, 0.6);
      }
      .voice-dock__stop::after {
        content: '';
        position: absolute;
        inset: 38px;
        border-radius: 8px;
        background: #eef1f3;
      }
      .voice-dock__word {
        min-width: 2ch;
      }
      .voice-dock[data-state='recording'] .voice-dock__word,
      .voice-dock.has-warning .voice-dock__word {
        color: #ff3b30;
      }
      .voice-dock[data-state='speaking'] .voice-dock__word {
        color: #ff625f;
      }
      .voice-dock[data-state='ready'] .voice-dock__word {
        color: #62d995;
      }
      /* The floating window has no frame; drag it anywhere. */
      body[data-mode='window'].in-shell {
        -webkit-app-region: drag;
        border-radius: 14px;
      }
    </style>
  </head>
  <body data-mode="window">
    <canvas id="owl3d-view"></canvas>
    <script>
      if (window.halOwl3d) document.body.classList.add('in-shell');
    </script>
    <script type="module" src="/src/owl3d/main.ts"></script>
  </body>
</html>
