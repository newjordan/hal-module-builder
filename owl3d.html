<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/hal_lens_1.png" />
    <title>HAL · Owl3D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #030406;
      }
      #owl3d-view {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* In stereo the pointer hides when idle; move the mouse to get it back. */
      body[data-mode='sbs'].pointer-idle,
      body[data-mode='full'].pointer-idle {
        cursor: none;
      }
      /* The floating window has no frame: drag it by an invisible top strip
         (the rest of the window is the 3D room, where clicks land). */
      .drag-strip {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        -webkit-app-region: drag;
      }
      body[data-mode='window'].in-shell .drag-strip {
        display: block;
      }
    </style>
  </head>
  <body data-mode="window">
    <canvas id="owl3d-view"></canvas>
    <div class="drag-strip"></div>
    <script>
      if (window.halOwl3d) document.body.classList.add('in-shell');
    </script>
    <script type="module" src="/src/owl3d/main.ts"></script>
  </body>
</html>
