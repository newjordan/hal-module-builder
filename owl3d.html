<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/hal_lens_1.png" />
    <title>HAL · Owl3D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #030406;
      }
      #owl3d-view {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* In stereo the pointer hides when idle; move the mouse to get it back. */
      body[data-mode='sbs'].pointer-idle,
      body[data-mode='full'].pointer-idle {
        cursor: none;
      }
      /* Voice dock (src/owl3d/voice/dock.ts); drawn once per eye in stereo. */
      .voice-dock {
        position: fixed;
        bottom: 20px;
        left: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px 8px 8px;
        border: 1px solid rgba(83, 216, 223, 0.35);
        border-radius: 999px;
        background: rgba(7, 9, 11, 0.78);
        color: #eef1f3;
        font: 500 14px -apple-system, 'SF Pro Text', Helvetica, sans-serif;
        transform-origin: left bottom;
        -webkit-app-region: no-drag;
        user-select: none;
        z-index: 10;
      }
      .voice-dock button {
        -webkit-app-region: no-drag;
        cursor: pointer;
        font: inherit;
      }
      /* The record button: a red dot. Hold to talk, or tap / tap. */
      .voice-dock__record {
        position: relative;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 2px solid rgba(255, 98, 95, 0.55);
        border-radius: 50%;
        background: #1b1f25;
        touch-action: none;
      }
      .voice-dock__record::after {
        content: '';
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: #ff3b30;
        box-shadow: 0 0 10px rgba(255, 59, 48, 0.6);
        transition: inset 120ms ease;
      }
      .voice-dock__record:hover::after {
        inset: 10px;
      }
      .voice-dock[data-state='recording'] .voice-dock__record {
        border-color: #ff3b30;
        box-shadow: 0 0 0 6px rgba(255, 59, 48, 0.25);
        animation: record-pulse 1s ease-in-out infinite;
      }
      .voice-dock[data-state='recording'] .voice-dock__record::after {
        inset: 8px;
        background: #ff5a4f;
      }
      .voice-dock[data-state='off'] .voice-dock__record::after,
      .voice-dock[data-state='loading'] .voice-dock__record::after {
        background: #5a2522;
        box-shadow: none;
      }
      @keyframes record-pulse {
        50% {
          box-shadow: 0 0 0 10px rgba(255, 59, 48, 0.08);
        }
      }
      .voice-dock__toggle {
        padding: 6px 10px;
        border: 1px solid #303840;
        border-radius: 999px;
        background: transparent;
        color: #8a97a3;
        font-size: 12px;
      }
      .voice-dock__toggle[aria-pressed='true'] {
        border-color: rgba(98, 217, 149, 0.6);
        background: rgba(98, 217, 149, 0.12);
        color: #62d995;
      }
      .voice-dock__text {
        display: grid;
        min-width: 120px;
      }
      .voice-dock__label {
        font-weight: 600;
      }
      .voice-dock__detail {
        color: #8a97a3;
        font-size: 12px;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .voice-dock__detail:empty {
        display: none;
      }
      .voice-dock__meter {
        width: 72px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .voice-dock__meter i {
        display: block;
        height: 100%;
        background: #53d8df;
        transform: scaleX(0);
        transform-origin: left;
      }
      .voice-dock[data-state='speaking'] .voice-dock__meter i,
      .voice-dock[data-state='recording'] .voice-dock__meter i {
        background: #ff625f;
      }
      .voice-dock__stop {
        padding: 6px 12px;
        border: 1px solid rgba(255, 98, 95, 0.6);
        border-radius: 999px;
        background: rgba(255, 98, 95, 0.12);
        color: #ff625f;
      }
      .voice-dock__input {
        max-width: 190px;
        padding: 5px 8px;
        border: 1px solid #303840;
        border-radius: 8px;
        background: #11151a;
        color: #c9d1d8;
        font: 500 12px -apple-system, 'SF Pro Text', Helvetica, sans-serif;
        -webkit-app-region: no-drag;
      }
      .voice-dock.has-warning .voice-dock__detail {
        color: #ff625f;
      }
      .voice-dock.has-warning .voice-dock__input {
        border-color: #ff625f;
      }
      .voice-dock kbd {
        color: #56616b;
        font: 500 12px 'SF Mono', Menlo, monospace;
      }
      /* The floating window has no frame; drag it anywhere. */
      body[data-mode='window'].in-shell {
        -webkit-app-region: drag;
        border-radius: 14px;
      }
    </style>
  </head>
  <body data-mode="window">
    <canvas id="owl3d-view"></canvas>
    <script>
      if (window.halOwl3d) document.body.classList.add('in-shell');
    </script>
    <script type="module" src="/src/owl3d/main.ts"></script>
  </body>
</html>
